server:
  port: 8081

spring:
  application:
    name: demo-schedule
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:false}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:false}
        file-extension: yml

# Elasticsearch
elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}
  scheme: ${ES_SCHEME:http}
  username: ${ES_USERNAME:}
  password: ${ES_PASSWORD:}

# 爬虫模式: local / remote
crawler:
  mode: local
  remote:
    url: http://localhost:8081/api/schedule/crawl/execute

# 定时任务配置 (可通过 Nacos 热更新)
schedule:
  spider:
    cron: "0 0 */2 * * ?"
    target-url: ""
    keyword: ""
    max-pages: 5
    proxy: ""

logging:
  level:
    com.example: debug
