server:
  port: 8084

spring:
  application:
    name: demo-spider
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:false}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:false}
        file-extension: yml

# Elasticsearch
elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}
  scheme: ${ES_SCHEME:http}
  username: ${ES_USERNAME:}
  password: ${ES_PASSWORD:}

# 爬虫模式: local / remote
crawler:
  mode: local
  remote:
    url: http://localhost:8084/api/spider/crawl/execute

logging:
  level:
    com.example: debug
