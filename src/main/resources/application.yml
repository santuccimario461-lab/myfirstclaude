server:
  port: 8080

spring:
  application:
    name: demo-service
  profiles:
    active: dev

# Elasticsearch Configuration
elasticsearch:
  host: localhost
  port: 9200
  scheme: http
  username: elastic
  password: changeme
  connection-timeout: 5000
  socket-timeout: 60000

# Jsoup Configuration
jsoup:
  timeout: 10000
  max-body-size: 0
  user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

# Logging
logging:
  level:
    root: INFO
    com.example.demo: DEBUG
    co.elastic.clients: WARN

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
